version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Amaan@123
      POSTGRES_MULTIPLE_DATABASES: products_db,orders_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - '5432:5432'
    networks:
      - revest-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - '5672:5672'
      - '15672:15672'
    networks:
      - revest-network

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: Amaan@123
      DB_NAME: products_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - revest-network

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: orders_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PRODUCT_SERVICE_URL: http://product-service:3001
      PORT: 3002
    ports:
      - '3002:3002'
    depends_on:
      - postgres
      - rabbitmq
      - product-service
    networks:
      - revest-network

networks:
  revest-network:
    driver: bridge

volumes:
  postgres_data:
